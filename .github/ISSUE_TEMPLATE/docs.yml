name: Docs
description: Something in the docs is wrong, missing, or unclear.
labels: ['documentation', 'needs-triage']
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: A link to the page on openspec.dev, or its file under docs-lab/.
      placeholder: https://openspec.dev/docs/cli, "openspec archive" section
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
      placeholder: It says `--yes` skips the spec sync, but it only skips the prompt.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What it should say instead
      description: Optional. What you expected to read, or what you found to be true once you worked it out.
    validations:
      required: false
