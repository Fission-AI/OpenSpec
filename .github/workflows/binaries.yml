name: Binaries

# Standalone `openspec` executables for people without Node.js (#2055).
# Pull requests smoke-test the host binary on each OS; a published release gets
# every platform's binary attached, cross-compiled from one Linux runner.
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach binaries to
        required: true

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.4.3'

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.0'
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: bun scripts/binary/build.mjs
      - name: Smoke-test the binary
        run: bash scripts/binary/smoke.sh dist-bin/openspec-*

  release:
    name: Attach to release
    if: github.repository == 'Fission-AI/OpenSpec' && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # upload release assets
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.0'
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: >-
          bun scripts/binary/build.mjs
          bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64 bun-windows-x64
      # Also checks the binary reports the version the tag names, so assets
      # never land on the wrong release.
      - name: Smoke-test the Linux binary
        run: |
          bash scripts/binary/smoke.sh dist-bin/openspec-linux-x64
          [[ "$TAG" == *"$(dist-bin/openspec-linux-x64 --version)" ]] || {
            echo "::error::Binary version does not match release tag $TAG"
            exit 1
          }
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist-bin
          sha256sum openspec-* > SHA256SUMS
          gh release upload "$TAG" openspec-* SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
