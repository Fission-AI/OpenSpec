<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; overflow: hidden; }
    #root { display: inline-block; }
    #root svg { display: block; }
  </style>
  <script>window.EXCALIDRAW_ASSET_PATH = "https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/";</script>
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw.production.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    window.renderDiagram = async function(jsonData) {
      try {
        const data = typeof jsonData === "string" ? JSON.parse(jsonData) : jsonData;
        const elements = data.elements || [];
        const appState = data.appState || {};
        const files = data.files || {};
        appState.viewBackgroundColor = appState.viewBackgroundColor || "#ffffff";
        appState.exportWithDarkMode = false;
        const svg = await ExcalidrawLib.exportToSvg({
          elements: elements,
          appState: { ...appState, exportBackground: true },
          files: files,
        });
        const root = document.getElementById("root");
        root.innerHTML = "";
        root.appendChild(svg);
        if (document.fonts && document.fonts.ready) { await document.fonts.ready; }
        window.__renderComplete = true;
        window.__renderError = null;
        return { success: true, width: svg.getAttribute("width"), height: svg.getAttribute("height") };
      } catch (err) {
        window.__renderComplete = true;
        window.__renderError = err.message;
        return { success: false, error: err.message };
      }
    };
    window.addEventListener("load", function () {
      if (window.ExcalidrawLib && window.ExcalidrawLib.exportToSvg) {
        window.__moduleReady = true;
      } else {
        window.__moduleError = "ExcalidrawLib not available after load";
      }
    });
  </script>
</body>
</html>
