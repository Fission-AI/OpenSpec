<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .traj {
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw 9s ease-in-out infinite;
    }
    .late { animation-delay: 0.35s; }
    .later { animation-delay: 0.7s; }
    .latest { animation-delay: 1.05s; }
    @keyframes draw {
      0% { stroke-dashoffset: 1; opacity: 1; }
      8% { stroke-dashoffset: 1; opacity: 1; }
      38% { stroke-dashoffset: 0; opacity: 1; }
      88% { stroke-dashoffset: 0; opacity: 1; }
      94% { stroke-dashoffset: 0; opacity: 0; }
      100% { stroke-dashoffset: 1; opacity: 0; }
    }
    .pop {
      opacity: 0;
      animation: pop 9s ease-in-out infinite;
    }
    @keyframes pop {
      0% { opacity: 0; }
      36% { opacity: 0; }
      44% { opacity: 1; }
      88% { opacity: 1; }
      94% { opacity: 0; }
      100% { opacity: 0; }
    }
    .early {
      opacity: 0;
      animation: early 9s ease-in-out infinite;
    }
    @keyframes early {
      0% { opacity: 0; }
      4% { opacity: 1; }
      88% { opacity: 1; }
      94% { opacity: 0; }
      100% { opacity: 0; }
    }
    .blink {
      opacity: 0;
      animation: blink 9s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 14% { opacity: 0; }
      20% { opacity: 1; }
      26% { opacity: 0.35; }
      32% { opacity: 1; }
      88% { opacity: 1; }
      94%, 100% { opacity: 0; }
    }
    text { font-size: 14px; }
    .title { font-size: 21px; font-weight: 600; }
    .cap { font-size: 14px; fill: #94a3b8; }
  </style>

  <!-- left panel -->
  <text x="70" y="66" class="title" fill="#ef4444">Without a shared plan</text>

  <circle cx="94" cy="294" r="9" fill="#f59e0b" class="early" />

  <circle cx="484" cy="132" r="14" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="5 5" class="early" />
  <text x="452" y="106" fill="#10b981" class="early">the goal</text>

  <path class="traj" pathLength="1" d="M104,290 Q274,236 450,178" stroke="#3b82f6" />
  <text x="460" y="182" fill="#3b82f6" class="pop">you</text>

  <path class="traj late" pathLength="1" d="M104,288 Q260,196 454,62" stroke="#a78bfa" />
  <text x="464" y="56" fill="#a78bfa" class="pop">agent, session 1</text>

  <path class="traj later" pathLength="1" d="M104,296 Q284,306 464,354" stroke="#a78bfa" />
  <text x="474" y="358" fill="#a78bfa" class="pop">agent, session 2</text>

  <path class="traj latest" pathLength="1" d="M102,298 Q252,362 442,464" stroke="#94a3b8" />
  <text x="452" y="470" fill="#94a3b8" class="pop">teammate</text>

  <text x="70" y="516" class="cap pop">aligned at the start, small differences compound each session</text>

  <!-- divider -->
  <line x1="620" y1="66" x2="620" y2="506" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 6" opacity="0.6" />

  <!-- right panel -->
  <text x="690" y="66" class="title" fill="#10b981">With a shared, updatable plan</text>

  <circle cx="714" cy="294" r="9" fill="#f59e0b" class="early" />

  <line x1="722" y1="292" x2="1082" y2="192" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7" class="early" />
  <text x="700" y="106" class="cap early">dashed: the spec, one shared route</text>

  <path class="traj" pathLength="1" d="M722,290 L812,245 L902,260 L992,205 L1080,190" stroke="#3b82f6" />
  <path class="traj late" pathLength="1" d="M722,292 L812,282 L902,230 L992,237 L1082,194" stroke="#a78bfa" />
  <path class="traj later" pathLength="1" d="M722,294 L802,256 L892,278 L982,216 L1078,190" stroke="#a78bfa" />
  <path class="traj latest" pathLength="1" d="M720,296 L820,238 L910,250 L1000,234 L1074,190" stroke="#94a3b8" />

  <circle cx="841" cy="257" r="6" fill="#3b82f6" class="blink" />
  <circle cx="955" cy="225" r="6" fill="#3b82f6" class="blink" />
  <text x="866" y="248" class="cap blink">review</text>
  <text x="980" y="216" class="cap blink">sync</text>

  <circle cx="1089" cy="183" r="13" fill="#10b981" class="pop" />
  <text x="1058" y="152" fill="#10b981" class="pop">the goal</text>

  <text x="690" y="516" class="cap pop">drift is corrected before it compounds</text>
</svg>
